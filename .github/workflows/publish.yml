name: Publicare

# DEZARMAT. Declansarea pe tag `v*` e scoasa intentionat: `rojo build` construieste
# place-ul DOAR din default.project.json, iar mesh-urile 3D (ReplicatedStorage.Assets)
# traiesc in fisierul place-ului, nu in Rojo — vezi comentariul din
# src/world/Platform.luau:82. Pana cand Assets intra in proiect si `tools/build`
# verifica prezenta lui, orice publicare sterge lumea 3D din place-ul live.
#
# Ramane doar butonul manual din Actions, ca sa nu plece nimic din reflex.
on:
  workflow_dispatch:

jobs:
  publicare:
    name: Urca in Roblox
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain (aftman.toml)
        uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Nu se publica nimic peste teste cazute.
      - name: Verificari
        run: lune run tools/check

      - name: Build
        run: lune run tools/build --rapid

      - name: Open Cloud
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: lune run tools/publish build/Barricade.rbxl
